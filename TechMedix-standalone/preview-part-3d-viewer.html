<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlackCat · 3D Part Viewer (Path A)</title>
<style>
  :root{
    --ink:#0a0a0f; --paper:#f0efe8; --white:#fff;
    --fire:#cc3d17; --fire-2:#d4401a; --steel:#2a2a33; --steel-2:#3a3a48;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --display:'Space Grotesk',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:radial-gradient(circle at 50% 35%,#15151f,#0a0a0f 75%);color:var(--white);font-family:var(--display);overflow:hidden;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  /* top bar */
  .topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px 26px;z-index:10;pointer-events:none;}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--fire);}
  .close{pointer-events:auto;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--white);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);padding:9px 16px;border-radius:999px;transition:.2s;}
  .close:hover{background:rgba(204,61,23,.25);border-color:var(--fire);}
  /* info panel */
  .panel{position:fixed;left:26px;bottom:26px;max-width:340px;z-index:10;
    background:rgba(20,17,15,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:20px 22px;}
  .panel .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fire);}
  .panel h2{font-size:24px;letter-spacing:-.02em;margin:6px 0 8px;}
  .panel p{font-size:13.5px;line-height:1.6;color:#b9b9c4;}
  .panel .meta{display:flex;gap:18px;margin-top:14px;font-family:var(--mono);font-size:11px;color:#8888a0;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;}
  .panel .meta b{display:block;color:var(--white);font-size:14px;margin-top:2px;}
  .sev-hi{color:var(--fire)!important;}
  .sev-md{color:#c8a96e!important;}
  /* part rail */
  .rail{position:fixed;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:10;}
  .rail button{cursor:pointer;width:54px;height:54px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05);color:#cfcfd8;font-family:var(--mono);font-size:9px;letter-spacing:.04em;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;transition:.18s;padding:4px;}
  .rail button:hover{border-color:var(--fire);color:#fff;}
  .rail button.on{background:rgba(204,61,23,.22);border-color:var(--fire);color:#fff;box-shadow:0 0 18px rgba(204,61,23,.4);}
  /* controls hint */
  .hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:#8888a0;z-index:10;text-align:center;}
  .hint b{color:#cfcfd8;}
  .tag3d{position:fixed;z-index:12;pointer-events:none;font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:#fff;background:rgba(204,61,23,.85);padding:5px 10px;border-radius:6px;
    transform:translate(-50%,-140%);white-space:nowrap;opacity:0;transition:opacity .25s;box-shadow:0 4px 14px rgba(0,0,0,.4);}
  .tag3d.on{opacity:1;}
  .subtags{position:fixed;inset:0;z-index:11;pointer-events:none;}
  .subtag{position:absolute;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    color:#cfcfd8;background:rgba(10,10,15,.78);border:1px solid rgba(204,61,23,.5);padding:3px 7px;border-radius:5px;
    transform:translate(-50%,-50%);white-space:nowrap;opacity:0;transition:opacity .3s;}
  .subtag.on{opacity:1;}
  .explode-btn{position:fixed;right:22px;bottom:26px;z-index:10;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    color:#fff;background:rgba(204,61,23,.18);border:1px solid var(--fire);padding:10px 16px;border-radius:999px;transition:.2s;}
  .explode-btn:hover{background:rgba(204,61,23,.34);}
  @media(max-width:720px){
    .panel{left:14px;right:14px;bottom:84px;max-width:none;}
    .rail{flex-direction:row;right:auto;left:50%;top:auto;bottom:18px;transform:translateX(-50%);flex-wrap:wrap;justify-content:center;max-width:92vw;}
    .explode-btn{bottom:64px;right:14px;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="topbar">
  <div class="brand">BlackCat Robotics · TechMedix AI</div>
  <div class="close" id="closeBtn">← back to teardown</div>
</div>

<div class="panel">
  <div class="tag" id="pTag">Knee Actuator</div>
  <h2 id="pTitle">Harmonic Drive</h2>
  <p id="pDesc">Flexspline fatigue from cyclical high-torque loading. Drag to orbit the part a full 360°.</p>
  <div class="meta">
    <span>MTBF<b id="pMtbf">1,400h</b></span>
    <span>Severity<b id="pSev" class="sev-hi">HIGH</b></span>
  </div>
</div>

<div class="rail" id="rail"></div>
<button class="explode-btn" id="explodeBtn">⊕ explode sections</button>
<div class="hint">Drag to <b>orbit 360°</b> · scroll to zoom · click the model to <b>explode</b></div>
<div class="tag3d" id="tag3d"></div>
<div class="subtags" id="subtags"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---- part catalog: each is a real 3D model built from primitives ----
const CATALOG = {
  head: {
    tag:'Head & Sensing', title:'Vision / Encoder', mtbf:'2,800h', sev:'MED', sevClass:'sev-md',
    desc:'Camera + head IMU. Drag to orbit — see the LIDAR dome, stereo cameras, and IMU block from every angle.',
    build(){
      const g=new THREE.Group();
      const shell=new THREE.MeshStandardMaterial({color:0x1a1a22,metalness:.7,roughness:.35});
      const head=new THREE.Mesh(new THREE.SphereGeometry(1,40,28), shell); head.scale.set(1,.95,1.05); g.add(head);
      // panel seam
      const seam=new THREE.Mesh(new THREE.TorusGeometry(1.0,.03,8,48),
        new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.4}));
      seam.rotation.x=Math.PI/2.1; g.add(seam);
      // LIDAR dome
      const dome=new THREE.Mesh(new THREE.SphereGeometry(.42,28,18,0,Math.PI*2,0,Math.PI/2),
        new THREE.MeshStandardMaterial({color:0x0a0a0f,metalness:.4,roughness:.15}));
      dome.position.y=.55; g.add(dome);
      const lidarRing=new THREE.Mesh(new THREE.TorusGeometry(.42,.04,10,32),
        new THREE.MeshStandardMaterial({color:0x2a2a33,metalness:.7,roughness:.3}));
      lidarRing.position.y=.55; lidarRing.rotation.x=Math.PI/2; g.add(lidarRing);
      // stereo cameras
      const camMat=new THREE.MeshStandardMaterial({color:0x15151f,metalness:.5,roughness:.4});
      [-.42,.42].forEach(x=>{
        const cam=new THREE.Mesh(new THREE.CylinderGeometry(.18,.2,.22,20),camMat);
        cam.rotation.x=Math.PI/2; cam.position.set(x,-.05,.86); g.add(cam);
        const lens=new THREE.Mesh(new THREE.CircleGeometry(.12,16),
          new THREE.MeshStandardMaterial({color:0x05050a,metalness:.2,roughness:.1}));
        lens.position.set(x,-.05,1.0); g.add(lens);
      });
      // glowing eye
      const eye=new THREE.Mesh(new THREE.SphereGeometry(.14,16,12),
        new THREE.MeshStandardMaterial({color:0xff5a1f,emissive:0xcc3d17,emissiveIntensity:.8}));
      eye.position.set(0,.18,.92); g.add(eye);
      // neck collar
      const collar=new THREE.Mesh(new THREE.CylinderGeometry(.55,.6,.3,24),
        new THREE.MeshStandardMaterial({color:0x2a2a33,metalness:.6,roughness:.4}));
      collar.position.y=-.95; g.add(collar);
      const boltMat=new THREE.MeshStandardMaterial({color:0xff5a1f,metalness:.3,roughness:.4,emissive:0xcc3d17,emissiveIntensity:.3});
      for(let i=0;i<6;i++){const a=i/6*Math.PI*2;
        const bolt=new THREE.Mesh(new THREE.SphereGeometry(.06,10,8),boltMat);
        bolt.position.set(Math.cos(a)*.52,-.95,Math.sin(a)*.52); g.add(bolt);}
      return subGroup(g,[
        {mesh:dome.clone(), off:new THREE.Vector3(0,1.6,0)},
        {mesh:cam.clone(), off:new THREE.Vector3(1.6,-.1,1.2)},
        {mesh:collar.clone(), off:new THREE.Vector3(-1.6,-.2,0)}
      ]);
    }
  },
  chest: {
    tag:'Power System', title:'Battery Pack · 864Wh', mtbf:'1,200h', sev:'HIGH', sevClass:'sev-hi',
    desc:'Cell-group voltage imbalance from repeated high-current discharge. Orbit to inspect the cell banks and BMS.',
    build(){
      const g=new THREE.Group();
      const housing=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.6,.9),
        new THREE.MeshStandardMaterial({color:0x2a2a33,metalness:.55,roughness:.5}));
      g.add(housing);
      const cellMat=new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.5,roughness:.5});
      const fireMat=new THREE.MeshStandardMaterial({color:0xff5a2c,emissive:0xcc3d17,emissiveIntensity:.5});
      const cells=[];
      for(let r=0;r<2;r++)for(let c=0;c<3;c++){
        const cell=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.9,20), c===0?fireMat:cellMat);
        cell.rotation.z=Math.PI/2; cell.position.set(-.65+c*.65, .35-r*.7, .5);
        g.add(cell); cells.push(cell);
        // terminal cap
        const cap=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.12,12),
          new THREE.MeshStandardMaterial({color:0x1a1a22,metalness:.6,roughness:.3}));
        cap.rotation.z=Math.PI/2; cap.position.set(-.65+c*.65+.5, .35-r*.7, .5); g.add(cap);
      }
      // housing seam
      const seam=new THREE.Mesh(new THREE.BoxGeometry(2.42,.05,.92),
        new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.4}));
      seam.position.y=.5; g.add(seam);
      const bms=new THREE.Mesh(new THREE.BoxGeometry(.7,.4,.2),
        new THREE.MeshStandardMaterial({color:0x15151f,metalness:.4}));
      bms.position.set(0,-.55,.55); g.add(bms);
      return subGroup(g,[
        {mesh:cells[0].clone(), off:new THREE.Vector3(0,1.5,1), label:'Cell Bank'},
        {mesh:cells[4].clone(), off:new THREE.Vector3(1.8,0,1), label:'Cell Group'},
        {mesh:bms.clone(), off:new THREE.Vector3(-1.8,0,1), label:'BMS'}
      ]);
    }
  },
  'thigh-l': {
    tag:'Knee Actuator', title:'Harmonic Drive', mtbf:'1,400h', sev:'HIGH', sevClass:'sev-hi',
    desc:'Flexspline fatigue from high-torque loading. Orbit the real strain-wave gear: wave generator, flexspline, circular spline.',
    build(){
      const g=new THREE.Group();
      const steel=new THREE.MeshStandardMaterial({color:0x2a2a33,metalness:.7,roughness:.35});
      // circular spline (outer ring) w/ internal teeth
      const outer=new THREE.Mesh(new THREE.TorusGeometry(1, .28, 20, 48),steel);
      g.add(outer);
      for(let i=0;i<20;i++){const a=i/20*Math.PI*2;
        const tooth=new THREE.Mesh(new THREE.BoxGeometry(.2,.2,.4),
          new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.3}));
        tooth.position.set(Math.cos(a)*.74,0,Math.sin(a)*.74); tooth.lookAt(0,0,0); g.add(tooth);}
      // flexspline (inner thin ring) w/ external teeth
      const flex=new THREE.Mesh(new THREE.TorusGeometry(.7,.12,16,48),
        new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.35}));
      g.add(flex);
      for(let i=0;i<20;i++){const a=i/20*Math.PI*2;
        const t=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.26),
          new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.3}));
        t.position.set(Math.cos(a)*.56,0,Math.sin(a)*.56); t.lookAt(0,0,0); g.add(t);}
      // wave generator (ellipse cam)
      const wave=new THREE.Mesh(new THREE.SphereGeometry(.55,.32,24),
        new THREE.MeshStandardMaterial({color:0xff5a2c,emissive:0xcc3d17,emissiveIntensity:.4,metalness:.3,roughness:.3}));
      wave.scale.set(1,.62,1); g.add(wave);
      return subGroup(g,[
        {mesh:outer.clone(), off:new THREE.Vector3(0,0,2), label:'Circular Spline'},
        {mesh:flex.clone(), off:new THREE.Vector3(2.2,0,0), label:'Flexspline'},
        {mesh:wave.clone(), off:new THREE.Vector3(-2.2,0,0), label:'Wave Generator'}
      ]);
    }
  },
  'thigh-r': {
    tag:'Hip Joint', title:'Abduction Bearing', mtbf:'1,800h', sev:'HIGH', sevClass:'sev-hi',
    desc:'Wave-generator bearing pitting under lateral load. Orbit the cross-roller bearing + housing.',
    build(){
      const g=new THREE.Group();
      const steel=new THREE.MeshStandardMaterial({color:0x2a2a33,metalness:.7,roughness:.35});
      const housing=new THREE.Mesh(new THREE.CylinderGeometry(1,.9,.7,32),steel);
      g.add(housing);
      // housing bolts
      const boltMat=new THREE.MeshStandardMaterial({color:0xff5a1f,emissive:0xcc3d17,emissiveIntensity:.3,metalness:.3,roughness:.4});
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2;
        const b=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),boltMat);
        b.position.set(Math.cos(a)*.92,0,Math.sin(a)*.92); g.add(b);}
      const inner=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.8,24),
        new THREE.MeshStandardMaterial({color:0xff5a2c,emissive:0xcc3d17,emissiveIntensity:.4}));
      g.add(inner);
      const race=new THREE.Mesh(new THREE.TorusGeometry(.75,.1,12,40),
        new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.3}));
      race.rotation.x=Math.PI/2; g.add(race);
      // cross-roller pins
      for(let i=0;i<10;i++){const a=i/10*Math.PI*2;
        const pin=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.5,10),
          new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.3}));
        pin.position.set(Math.cos(a)*.75,0,Math.sin(a)*.75); pin.rotation.z=Math.PI/2; g.add(pin);}
      return subGroup(g,[
        {mesh:housing.clone(), off:new THREE.Vector3(0,0,2)},
        {mesh:inner.clone(), off:new THREE.Vector3(2,0,0)},
        {mesh:race.clone(), off:new THREE.Vector3(-2,0,0)}
      ]);
    }
  },
  'shin-r': {
    tag:'Lower Limb', title:'Ankle Encoder', mtbf:'2,800h', sev:'MED', sevClass:'sev-md',
    desc:'Magnetic position sensor degradation. Orbit the encoder disc + pivot link.',
    build(){
      const g=new THREE.Group();
      const steel=new THREE.MeshStandardMaterial({color:0x2a2a33,metalness:.7,roughness:.35});
      const dark=new THREE.MeshStandardMaterial({color:0x1a1a22,metalness:.6,roughness:.4});
      // shin link with ridges
      const link=new THREE.Mesh(new THREE.BoxGeometry(.8,1.4,.6),steel);
      g.add(link);
      for(let i=0;i<3;i++){const r=new THREE.Mesh(new THREE.BoxGeometry(.86,.08,.66),
        new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.4}));
        r.position.y=-.4+i*.4; g.add(r);}
      // ankle encoder disc w/ magnet ring
      const disc=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.18,32),
        new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.3}));
      disc.position.y=-.8; g.add(disc);
      const mag=new THREE.Mesh(new THREE.TorusGeometry(.42,.06,10,32),
        new THREE.MeshStandardMaterial({color:0xff5a2c,emissive:0xcc3d17,emissiveIntensity:.5}));
      mag.position.y=-.72; mag.rotation.x=Math.PI/2; g.add(mag);
      // pivot ball
      const pivot=new THREE.Mesh(new THREE.SphereGeometry(.35,20,16),
        new THREE.MeshStandardMaterial({color:0x1a1a22,metalness:.6,roughness:.35}));
      pivot.position.y=.7; g.add(pivot);
      // foot plate
      const foot=new THREE.Mesh(new THREE.BoxGeometry(1.1,.18,.9),dark);
      foot.position.y=-1.05; g.add(foot);
      const boltMat=new THREE.MeshStandardMaterial({color:0xff5a1f,emissive:0xcc3d17,emissiveIntensity:.3,metalness:.3,roughness:.4});
      [[-.4,-.3],[.4,-.3],[-.4,.3],[.4,.3]].forEach(([x,z])=>{
        const b=new THREE.Mesh(new THREE.SphereGeometry(.06,10,8),boltMat);
        b.position.set(x,-1.05,z); g.add(b);});
      return subGroup(g,[
        {mesh:link.clone(), off:new THREE.Vector3(0,0,1.8)},
        {mesh:disc.clone(), off:new THREE.Vector3(1.8,-.4,0)},
        {mesh:pivot.clone(), off:new THREE.Vector3(-1.8,.4,0)}
      ]);
    }
  },
  'arm-l': {
    tag:'Upper Body', title:'Arm Actuator', mtbf:'2,100h', sev:'MED', sevClass:'sev-md',
    desc:'Shoulder harmonic drive wear. Orbit the actuator + forearm link + gripper.',
    build(){
      const g=new THREE.Group();
      const steel=new THREE.MeshStandardMaterial({color:0x2a2a33,metalness:.7,roughness:.35});
      const dark=new THREE.MeshStandardMaterial({color:0x1a1a22,metalness:.6,roughness:.4});
      // actuator body with cooling fins
      const act=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.1,28),steel);
      g.add(act);
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2;
        const fin=new THREE.Mesh(new THREE.BoxGeometry(.04,.9,.16),
          new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.4}));
        fin.position.set(Math.cos(a)*.56,0,Math.sin(a)*.56); fin.lookAt(0,0,0); g.add(fin);}
      // shoulder bolts
      const boltMat=new THREE.MeshStandardMaterial({color:0xff5a1f,emissive:0xcc3d17,emissiveIntensity:.3,metalness:.3,roughness:.4});
      for(let i=0;i<4;i++){const a=i/4*Math.PI*2;
        const b=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),boltMat);
        b.position.set(Math.cos(a)*.4,.55,Math.sin(a)*.4); g.add(b);}
      // forearm link
      const forearm=new THREE.Mesh(new THREE.BoxGeometry(.5,1.1,.5),dark);
      forearm.position.y=-.9; g.add(forearm);
      const ridge=new THREE.Mesh(new THREE.BoxGeometry(.54,.1,.54),
        new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.4}));
      ridge.position.y=-.6; g.add(ridge);
      // gripper with fingers + wrist
      const gripBase=new THREE.Mesh(new THREE.BoxGeometry(.5,.18,.5),steel);
      gripBase.position.y=-1.55; g.add(gripBase);
      const fingerMat=new THREE.MeshStandardMaterial({color:0x3a3a48,metalness:.6,roughness:.4});
      [-.16,.16].forEach(x=>{const f=new THREE.Mesh(new THREE.BoxGeometry(.1,.4,.18),fingerMat);
        f.position.set(x,-1.8,0); g.add(f);});
      const wrist=new THREE.Mesh(new THREE.SphereGeometry(.35,20,16),
        new THREE.MeshStandardMaterial({color:0xff5a2c,emissive:0xcc3d17,emissiveIntensity:.4}));
      wrist.position.y=-1.35; g.add(wrist);
      return subGroup(g,[
        {mesh:act.clone(), off:new THREE.Vector3(0,0,1.8)},
        {mesh:forearm.clone(), off:new THREE.Vector3(1.8,-.4,0)},
        {mesh:wrist.clone(), off:new THREE.Vector3(-1.8,-.4,0)}
      ]);
    }
  }
};

// helper: wrap base mesh + record sub-piece meshes for explode
function subGroup(base, subs){
  base.userData.subs = subs.map(s=>{
    const m = s.mesh; base.add(m); m.userData.home = m.position.clone();
    m.userData.off = s.off.clone(); m.userData.label = s.label||''; return m;
  });
  return base;
}

// ---- scene setup ----
const app=document.getElementById('app');
const scene=new THREE.Scene();
const subtags=document.getElementById('subtags');
const camera=new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 100);
camera.position.set(0, 1.2, 7);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
app.appendChild(renderer.domElement);

// lights
scene.add(new THREE.AmbientLight(0xffffff,.55));
const key=new THREE.DirectionalLight(0xffffff,1.1); key.position.set(4,6,5); scene.add(key);
const rim=new THREE.PointLight(0xcc3d17,1.4,30); rim.position.set(-4,2,-3); scene.add(rim);

// turntable platform (reflective)
const platform=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.6,.12,64),
  new THREE.MeshStandardMaterial({color:0x14110f,metalness:.7,roughness:.25,envMapIntensity:1.2}));
platform.position.y=-2.2; scene.add(platform);
const ring=new THREE.Mesh(new THREE.TorusGeometry(2.6,.03,8,80),
  new THREE.MeshBasicMaterial({color:0xcc3d17,transparent:true,opacity:.5}));
ring.rotation.x=Math.PI/2; ring.position.y=-2.14; scene.add(ring);
// soft fill so back faces aren't black
const fill=new THREE.DirectionalLight(0xffffff,.5); fill.position.set(-4,1,4); scene.add(fill);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.minDistance=4; controls.maxDistance=12; controls.autoRotate=true; controls.autoRotateSpeed=1.6;
controls.target.set(0,0,0);

// current model
let model=null, currentKey='thigh-l', exploded=false;
function loadPart(key){
  if(model){ scene.remove(model); disposeModel(model); }
  currentKey=key;
  model=CATALOG[key].build();
  scene.add(model);
  exploded=false;
  // update panel
  const c=CATALOG[key];
  document.getElementById('pTag').textContent=c.tag;
  document.getElementById('pTitle').textContent=c.title;
  document.getElementById('pDesc').textContent=c.desc;
  document.getElementById('pMtbf').textContent=c.mtbf;
  const sev=document.getElementById('pSev'); sev.textContent=c.sev; sev.className=c.sevClass;
  document.querySelectorAll('.rail button').forEach(b=>b.classList.toggle('on',b.dataset.k===key));
  // (re)build sub-piece labels
  subtags.innerHTML='';
  if(model && model.userData.subs){
    model.userData.subs.forEach(s=>{
      if(!s.userData.label)return;
      const el=document.createElement('div'); el.className='subtag'; el.textContent=s.userData.label;
      el.dataset.ref=''; subtags.appendChild(el); s.userData.el=el;
    });
  }
function disposeModel(g){ g.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); }); }

// explode toggle
function setExplode(on){
  exploded=on;
  if(!model)return;
  model.userData.subs.forEach(m=>{
    const t = on ? m.userData.off : new THREE.Vector3(0,0,0);
    m.userData.target = t;
  });
}
document.getElementById('explodeBtn').addEventListener('click',()=>{
  setExplode(!exploded);
  document.getElementById('explodeBtn').textContent = exploded ? '⊗ assemble' : '⊕ explode sections';
});

// build rail buttons
const rail=document.getElementById('rail');
Object.keys(CATALOG).forEach(k=>{
  const b=document.createElement('button');
  b.dataset.k=k; b.textContent=CATALOG[k].title.split(' ')[0].replace('/',' ');
  b.addEventListener('click',()=>loadPart(k));
  rail.appendChild(b);
});

// close
document.getElementById('closeBtn').addEventListener('click',()=>{
  document.getElementById('closeBtn').textContent='← (close in real build)';
});

loadPart('thigh-l');

// floating 3D label tracking the active part
const tag3d=document.getElementById('tag3d');
const _v=new THREE.Vector3();
function updateTag(){
  if(!model){tag3d.classList.remove('on');return;}
  model.updateWorldMatrix(true,false);
  _v.set(0,0,0); model.localToWorld(_v); _v.project(camera);
  const x=(_v.x*.5+.5)*innerWidth, y=(-_v.y*.5+.5)*innerHeight;
  tag3d.style.left=x+'px'; tag3d.style.top=y+'px';
  tag3d.textContent=CATALOG[currentKey].title;
  tag3d.classList.add('on');
  // sub-piece labels (only when exploded)
  if(model.userData.subs){
    model.userData.subs.forEach(s=>{
      const el=s.userData.el; if(!el)return;
      if(!exploded){el.classList.remove('on');return;}
      s.updateWorldMatrix(true,false);
      _v.set(0,0,0); s.localToWorld(_v); _v.project(camera);
      el.style.left=((_v.x*.5+.5)*innerWidth)+'px';
      el.style.top=((-_v.y*.5+.5)*innerHeight)+'px';
      el.classList.add('on');
    });
  }
}

// pause auto-rotate while interacting
renderer.domElement.addEventListener('pointerenter',()=>controls.autoRotate=false);
renderer.domElement.addEventListener('pointerleave',()=>controls.autoRotate=true);
// click the model to explode/assemble
renderer.domElement.addEventListener('click',()=>{
  setExplode(!exploded);
  document.getElementById('explodeBtn').textContent = exploded ? '⊗ assemble' : '⊕ explode sections';
});

// animate
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  if(model && model.userData.subs){
    model.userData.subs.forEach(m=>{
      const tgt = exploded ? m.userData.off : new THREE.Vector3(0,0,0);
      m.position.lerp(tgt, 1-Math.pow(.001, dt));
    });
  }
  ring.rotation.z += dt*.3;
  controls.update();
  updateTag();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
